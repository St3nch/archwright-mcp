[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archwright-mcp"
version = "0.1.0"
description = "Temporary root-capable MCP control plane for bootstrapping a Linux workstation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.2.0",
]

[project.scripts]
archwright-mcp = "archwright_mcp.server:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/archwright_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
